<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Proposal by Abhishek Pratap</title>
  <!-- Canvas Confetti Library for Final Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif, system-ui;
    }
    body {
      background: radial-gradient(circle at center, #2e081d 0%, #0d0109 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Floating Hearts Animation */
    .bg-hearts span {
      position: absolute;
      color: rgba(255, 105, 180, 0.3);
      font-size: 20px;
      animation: float 6s linear infinite;
      bottom: -30px;
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
      z-index: 10;
    }

    /* Developer Branding Header */
    .dev-credit {
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: #ff9ebb;
      margin-bottom: 18px;
      font-weight: 500;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
      animation: fadeIn 1s ease-in-out;
    }

    /* Screen 1: Loading Screen */
    .loading-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 30px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .loading-text {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #ffb6c1;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      transition: width 0.1s linear;
      border-radius: 10px;
    }
    .percentage {
      font-size: 0.9rem;
      color: #ddd;
    }

    /* Screen 2: Envelope Transition Screen */
    .envelope-wrapper {
      cursor: pointer;
      display: inline-block;
      margin-top: 20px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .envelope {
      width: 150px;
      height: 100px;
      background: #ff4b2b;
      position: relative;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }
    .envelope::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 0;
      border-left: 75px solid transparent;
      border-right: 75px solid transparent;
      border-bottom: 50px solid #ff416c;
    }
    .envelope-heart {
      font-size: 30px;
      z-index: 2;
    }

    /* Question Cards Wrapper */
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      animation: fadeIn 0.6s ease-out;
      position: relative;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .question-title {
      font-size: 1.3rem;
      margin-bottom: 25px;
      color: #fff;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 20px;
      font-size: 0.95rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .btn-yes {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      color: white;
      box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
    }
    .btn-yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Dodging button style */
    .btn-dodge {
      position: absolute;
      transition: top 0.2s ease, left 0.2s ease;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="container">
    
    <!-- Branding Header -->
    <div class="dev-credit">✨ Crafted with ❤️ by Abhishek Pratap ✨</div>

    <!-- 1. LOADING SCREEN -->
    <div id="loadingScreen" class="loading-box">
      <div id="loadingText" class="loading-text">Initializing Love.exe...</div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="percentageText" class="percentage">0%</div>
    </div>

    <!-- 2. ENVELOPE SCREEN -->
    <div id="envelopeScreen" class="hidden">
      <p style="margin-bottom: 15px; font-size: 1.1rem; color: #ffb6c1;">A Letter Arrived 💌</p>
      <div class="envelope-wrapper" onclick="openEnvelope()">
        <div class="envelope">
          <div class="envelope-heart">💖</div>
        </div>
      </div>
      <p style="margin-top: 15px; font-size: 0.85rem; color: #aaa;">Tap the envelope to open it</p>
    </div>

    <!-- 3. QUESTION CARDS -->
    <div id="cardScreen" class="card hidden">
      <div id="questionTitle" class="question-title"></div>
      <div id="buttonGroup" class="btn-group"></div>
    </div>

  </div>

  <script>
    // Create background hearts
    const bgHearts = document.getElementById('bgHearts');
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('span');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.style.animationDelay = Math.random() * 5 + 's';
      bgHearts.appendChild(heart);
    }

    // Sequence & User Responses Data
    let currentStage = 0;
    let selectedDateType = "Coffee Date";
    let userResponses = {};

    // Quiz Questions Setup
    const stages = [
      {
        title: "Aapse kuch question puch skta hu?",
        options: [
          { text: "Haa", action: "next" }
        ]
      },
      {
        title: "Are you single?",
        options: [
          { text: "Haa", action: "next" },
          { text: "Nhi", action: "end" }
        ]
      },
      {
        title: "Date ke liye soch rhi ho?",
        options: [
          { text: "Haa", action: "next" }
        ]
      },
      {
        title: "Kaisi date p jaana pasand krogi? ✨",
        options: [
          { text: "Coffee Date ☕", action: "selectDate", value: "Coffee Date" },
          { text: "Movie Date 🍿", action: "selectDate", value: "Movie Date" },
          { text: "Dinner Date 🍷", action: "selectDate", value: "Dinner Date" },
          { text: "Long Drive 🚗", action: "selectDate", value: "Long Drive" }
        ]
      },
      {
        title: "Late night talks pasand hh? 🌙",
        options: [
          { text: "YES", action: "next", responseKey: "Late Night Talks", value: "YES" },
          { text: "NO", action: "next", responseKey: "Late Night Talks", value: "NO" }
        ]
      },
      {
        title: "Mere saath date p chlogi? ❤️",
        options: [
          { text: "YES", action: "finish" },
          { text: "NO", action: "dodge" }
        ]
      }
    ];

    // Screen Elements
    const loadingScreen = document.getElementById('loadingScreen');
    const progressBar = document.getElementById('progressBar');
    const percentageText = document.getElementById('percentageText');
    const loadingText = document.getElementById('loadingText');
    
    const envelopeScreen = document.getElementById('envelopeScreen');
    const cardScreen = document.getElementById('cardScreen');
    const questionTitle = document.getElementById('questionTitle');
    const buttonGroup = document.getElementById('buttonGroup');

    window.onload = () => {
      runLoadingSequence();
    };

    function runLoadingSequence() {
      let progress = 0;
      const interval = setInterval(() => {
        progress += 2;
        progressBar.style.width = progress + '%';
        percentageText.innerText = progress + '%';

        if(progress === 40) loadingText.innerText = "Searching for the prettiest smile...";
        if(progress === 80) loadingText.innerText = "Found 1 Result ❤️";

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            loadingScreen.classList.add('hidden');
            showEnvelope();
          }, 500);
        }
      }, 50);
    }

    function showEnvelope() {
      cardScreen.classList.add('hidden');
      envelopeScreen.classList.remove('hidden');
    }

    function openEnvelope() {
      envelopeScreen.classList.add('hidden');
      renderCard();
      cardScreen.classList.remove('hidden');
    }

    function renderCard() {
      const data = stages[currentStage];
      questionTitle.innerText = data.title;
      buttonGroup.innerHTML = '';

      data.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.innerText = opt.text;

        if (opt.action === 'dodge') {
          btn.classList.add('btn-no', 'btn-dodge');
          btn.addEventListener('mouseover', moveButton);
          btn.addEventListener('touchstart', moveButton);
        } else {
          btn.classList.add('btn-yes');
          btn.onclick = () => handleChoice(opt);
        }

        buttonGroup.appendChild(btn);
      });
    }

    function moveButton(e) {
      const btn = e.target;
      const x = Math.random() * (window.innerWidth - 120) - (window.innerWidth / 2 - 60);
      const y = Math.random() * (window.innerHeight - 120) - (window.innerHeight / 2 - 60);
      
      btn.style.position = 'fixed';
      btn.style.left = Math.max(20, Math.min(window.innerWidth - 100, window.innerWidth / 2 + x)) + 'px';
      btn.style.top = Math.max(20, Math.min(window.innerHeight - 50, window.innerHeight / 2 + y)) + 'px';
    }

    function handleChoice(option) {
      if (option.responseKey) {
        userResponses[option.responseKey] = option.value;
      }

      if (option.action === 'selectDate') {
        selectedDateType = option.value;
        userResponses['Selected Date Type'] = selectedDateType;
        currentStage++;
        showEnvelope();
      } else if (option.action === 'end') {
        questionTitle.innerText = "Okay, koi baat nahi! 😊 Have a great time!";
        buttonGroup.innerHTML = '';
      } else if (option.action === 'next') {
        currentStage++;
        showEnvelope();
      } else if (option.action === 'finish') {
        showFinalScreen();
      }
    }

    // Function to send response to Formspree endpoint automatically
    function sendResponseToEmail() {
      fetch("https://formspree.io/f/xljdblkv", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(userResponses)
      }).catch(err => console.log("Email error:", err));
    }

    function showFinalScreen() {
      questionTitle.innerText = `Congratulations, your ${selectedDateType} has been fixed ❤️✨`;
      buttonGroup.innerHTML = '';
      
      // Auto Send Email via Formspree
      sendResponseToEmail();

      // Trigger Confetti Celebration
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }
  </script>
</body>
</html>
